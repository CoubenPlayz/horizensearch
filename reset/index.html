<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resetting HorizenTech Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-deep:#08090d;--bg-tertiary:#1b1f2b;--border:#262d40;
    --text-primary:#e4e8f1;--text-muted:#4a5268;--accent:#00e09e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',sans-serif;background:var(--bg-deep);color:var(--text-primary);height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .bg-mesh{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 700px 500px at 5% 15%,rgba(0,224,158,0.035),transparent),
    radial-gradient(ellipse 500px 600px at 95% 85%,rgba(0,160,120,0.025),transparent),
    radial-gradient(ellipse 900px 250px at 50% 0%,rgba(0,80,70,0.02),transparent))}
  .grid-overlay{position:fixed;inset:0;pointer-events:none;opacity:0.018;
    background-image:linear-gradient(var(--text-primary) 1px,transparent 1px),linear-gradient(90deg,var(--text-primary) 1px,transparent 1px);background-size:50px 50px}

  .reset-card{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px;padding:40px;text-align:center}
  .reset-icon{width:56px;height:56px;border-radius:14px;background:rgba(0,224,158,0.08);border:1px dashed rgba(0,224,158,0.3);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);animation:spinSlow 3s linear infinite}
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  .reset-title{font-size:22px;font-weight:600;letter-spacing:-0.5px}
  .reset-title span{background:linear-gradient(135deg,var(--accent),#00b8d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .reset-bar{width:240px;height:4px;background:var(--bg-tertiary);border-radius:2px;overflow:hidden}
  .reset-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#00b8d4);border-radius:2px;transition:width 0.3s ease}
  .reset-status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:7px;min-height:16px}
  .reset-status .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);position:relative;flex-shrink:0}
  .reset-status .pulse-dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--accent);animation:pulseDot 1.5s infinite}
  @keyframes pulseDot{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
  .reset-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent)}
  .reset-fallback{margin-top:14px;font-size:11px;color:var(--text-muted)}
  .reset-fallback a{color:var(--accent);text-decoration:underline}

  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="grid-overlay"></div>

<div class="reset-card">
  <div class="reset-icon"><i class="fas fa-rotate"></i></div>
  <div class="reset-title">Resetting <span>HorizenTech Suite</span></div>
  <div class="reset-bar"><div class="reset-bar-fill" id="barFill"></div></div>
  <div class="reset-pct" id="pctText">0%</div>
  <div class="reset-status"><div class="pulse-dot"></div><span id="statusText">Initializing reset...</span></div>
  <div class="reset-fallback">Not redirecting? <a href="https://horizensearch.com/reset">Continue manually</a></div>
</div>

<script>
const REDIRECT_URL = 'https://horizensearch.com/reset';
const TOTAL_MS = 5000;
const STEPS = [
  'Initializing reset...',
  'Clearing session data...',
  'Resetting HorizenTech Suite...',
  'Flushing local cache...',
  'Rebuilding configuration...',
  'Finalizing...',
];

const fill = document.getElementById('barFill');
const pctText = document.getElementById('pctText');
const statusText = document.getElementById('statusText');

const start = Date.now();
const timer = setInterval(() => {
  const elapsed = Date.now() - start;
  const progress = Math.min(elapsed / TOTAL_MS, 1);
  const pct = Math.round(progress * 100);
  fill.style.width = pct + '%';
  pctText.textContent = pct + '%';
  statusText.textContent = STEPS[Math.min(Math.floor(progress * STEPS.length), STEPS.length - 1)];
  if (progress >= 1) {
    clearInterval(timer);
    statusText.textContent = 'Reset complete. Redirecting...';
    setTimeout(() => { window.location.href = REDIRECT_URL; }, 600);
  }
}, 100);
</script>
</body>
</html>
