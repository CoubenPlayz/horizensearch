<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HorizenIdentify Status</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .status-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 20px;
        }
        .status-message {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .status-subtext {
            font-size: 1rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="status-container">
        <div class="status-message">HorizenIdentify has been turned off</div>
        <div class="status-subtext">Redirecting to HorizenSearch...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                window.location.href = "https://horizensearch.com/main";
            }, 1000);
        });
    </script>
</body>
</html>
